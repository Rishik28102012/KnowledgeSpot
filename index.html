<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnBuddy: learn by playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe3ff;--card:#fff;--ink:#1b1b3a;--yellow:#ffd23f;--pink:#ff5d8f;--mint:#3ddc97;--violet:#7b5cff;--muted:#4a4a72;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17163a;--card:#25235a;--ink:#f4f2ff;--muted:#b9b6e8}}
:root[data-theme="dark"]{--bg:#17163a;--card:#25235a;--ink:#f4f2ff;--muted:#b9b6e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px}
header span.o{font-size:34px}
h1{font-size:clamp(38px,9vw,64px);line-height:1.02;margin:28px 0 12px;font-weight:700;letter-spacing:-.02em}
p.sub{font-size:20px;color:var(--muted);max-width:34ch;margin:0 0 26px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px;margin-bottom:24px}
h2{font-size:22px;margin:0 0 12px}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
button{font:inherit;color:var(--ink);cursor:pointer}
.chip{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 0;font-weight:600;font-size:20px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#1b1b3a}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.subj{border:3px solid var(--ink);border-radius:18px;padding:14px 6px;font-weight:600;font-size:19px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;color:#1b1b3a}
.subj b{font-size:34px}
.subj[data-s="math"]{background:var(--pink)}.subj[data-s="english"]{background:var(--mint)}.subj[data-s="science"]{background:var(--violet);color:#fff}
.subj[aria-pressed="true"]{outline:4px solid var(--yellow);outline-offset:3px}
.go{width:100%;margin-top:6px;border:3px solid var(--ink);background:var(--yellow);color:#1b1b3a;border-radius:18px;padding:16px;font-size:26px;font-weight:700;box-shadow:5px 5px 0 var(--ink)}
.go:disabled{opacity:.55;cursor:not-allowed}
.go:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;margin-bottom:12px;flex-wrap:wrap}
.pill{border:3px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 14px}
.bar{height:14px;border:3px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.buddy{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.buddy .o{font-size:52px}
.say{background:var(--yellow);color:#1b1b3a;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-weight:500}
.q{font-size:clamp(28px,7vw,42px);font-weight:700;margin:6px 0 18px;line-height:1.15}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:16px 8px;font-size:24px;font-weight:600;box-shadow:4px 4px 0 var(--ink)}
.opt.ok{background:var(--mint);color:#1b1b3a}.opt.no{background:var(--pink);color:#1b1b3a}
.opt:disabled{cursor:default}
.big{font-size:64px;margin:0;text-align:center}
.center{text-align:center}
.link{background:none;border:0;text-decoration:underline;font-size:18px;color:var(--muted);margin-top:10px}
.hidden{display:none}
.bgf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgf span{position:absolute;opacity:.4;animation:float ease-in-out infinite alternate}
.wrap{position:relative;z-index:1}
.o{animation:bob 2.6s ease-in-out infinite}
.o.happy{animation:jump .6s}.o.sad{animation:shake .5s}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;animation:drop .6s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .15s}
.l:hover{transform:translateY(-8px) rotate(-6deg)}
.enter{animation:enter .45s cubic-bezier(.3,1.4,.5,1)}
.pop{animation:pop .4s}.shake{animation:shake .4s}.slide{animation:slideIn .35s}
.opt{animation:optIn .35s backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt.ok{animation:pop .5s}.opt.no{animation:shake .45s}
@media (hover:hover){.opt:not(:disabled):hover{transform:translateY(-4px) rotate(-1deg);box-shadow:4px 8px 0 var(--ink)}.chip:hover:not(:active){transform:translateY(-3px) rotate(-3deg)}.subj:hover b{transform:scale(1.25) rotate(-8deg)}}
.subj b{transition:transform .15s}
.subj[aria-pressed="true"] b{animation:jump .6s}
.chip[aria-pressed="true"]{animation:pop .35s}
.go:not(:disabled){animation:pulse 1.6s infinite}
.bar i{background-image:linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.4) 75%,transparent 75%);background-size:28px 28px;animation:stripes 1s linear infinite}
.pill.hot{background:var(--yellow);color:#1b1b3a;animation:glow .7s infinite alternate}
.st{display:inline-block;animation:starPop .6s cubic-bezier(.3,1.8,.5,1) backwards}
.cf{position:fixed;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50}
.cf.b{animation:burst 1s ease-out forwards}.cf.f{top:-20px;animation:fall 2s linear forwards}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
@keyframes float{to{transform:translateY(-34px) rotate(14deg)}}
@keyframes jump{30%{transform:translateY(-22px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{40%{transform:scale(1.2)}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}}
@keyframes optIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-20deg) scale(.5)}}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes pulse{50%{box-shadow:5px 5px 0 var(--ink),0 0 0 9px rgba(255,210,63,.55)}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes glow{to{box-shadow:0 0 0 4px var(--pink)}}
@keyframes starPop{from{opacity:0;transform:scale(0) rotate(-180deg)}}
@keyframes burst{40%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}100%{transform:translate(calc(var(--dx)*1.2),calc(var(--dy) + 260px)) rotate(calc(var(--rot)*2));opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.lvl{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.gc{border:3px solid var(--ink);border-radius:20px;padding:14px;text-align:left;box-shadow:5px 5px 0 var(--ink);color:#1b1b3a;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.gc:last-child{grid-column:1/-1}
.gc b{font-size:46px;line-height:1.1;display:inline-block;animation:bob 3s ease-in-out infinite}
.gc strong{font-size:23px}.gc small{font-size:15px;font-weight:500}
.gc:nth-child(1){background:#ff5d8f}.gc:nth-child(2){background:#3ddc97}.gc:nth-child(3){background:#7b5cff;color:#fff}.gc:nth-child(4){background:#ffd23f}.gc:nth-child(5){background:#4cc9f0}
@media (hover:hover){.gc:hover{transform:translateY(-4px) rotate(-1.5deg)}}
.gc:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.arena{position:relative;height:min(56vh,440px);min-height:340px;border:3px solid var(--ink);border-radius:22px;background:var(--card);overflow:hidden;box-shadow:6px 6px 0 var(--ink);user-select:none;touch-action:manipulation}
.tgt{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:clamp(24px,7vw,36px);font-weight:700;z-index:3;pointer-events:none}
.tgt span{display:inline-block;background:var(--yellow);color:#1b1b3a;border:3px solid var(--ink);border-radius:14px;padding:2px 16px}
.bub{position:absolute;bottom:-90px;width:78px;height:78px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:28px;font-weight:700;background:radial-gradient(circle at 30% 28%,#fff 0 12%,var(--c) 14%);color:#1b1b3a;animation:rise linear forwards;cursor:pointer;padding:0}
.bub.poof{animation:poof .25s forwards}.bub.shake{animation:shake .4s}
@keyframes rise{from{bottom:-90px}to{bottom:105%}}
@keyframes poof{to{transform:scale(1.7);opacity:0}}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;padding:12px}
.emo{font-size:84px;animation:bob 2.6s ease-in-out infinite}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot{width:42px;height:50px;border:3px dashed var(--ink);border-radius:10px;display:grid;place-items:center;font-size:26px;font-weight:700}
.slot.f{border-style:solid;background:var(--mint);color:#1b1b3a;animation:pop .3s}
.tile{width:48px;height:54px;border:3px solid var(--ink);background:var(--yellow);color:#1b1b3a;border-radius:12px;font-size:26px;font-weight:700;box-shadow:3px 3px 0 var(--ink);padding:0}
.tile:disabled{opacity:.25;box-shadow:none}
.item{position:absolute;left:50%;top:-110px;width:120px;margin-left:-60px;text-align:center;font-size:58px;line-height:1.1;animation:drop2 linear forwards;z-index:2}
.item small{display:block;font-size:17px;font-weight:600}
@keyframes drop2{to{top:50%}}
.bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:10px}
.bin{border:3px solid var(--ink);border-radius:14px;padding:16px 4px;font-size:19px;font-weight:700;color:#1b1b3a;box-shadow:3px 3px 0 var(--ink)}
.bin:active{transform:translate(2px,2px)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;height:100%;align-content:center}
.mc{height:clamp(70px,12vh,96px);border:3px solid var(--ink);border-radius:14px;font-size:clamp(13px,3.6vw,19px);font-weight:700;background:var(--violet);color:#fff;padding:2px;box-shadow:3px 3px 0 var(--ink)}
.mc.up{background:var(--card);color:var(--ink);animation:flip .3s}.mc.e{font-size:36px}.mc.ok{background:var(--mint);color:#1b1b3a}
@keyframes flip{from{transform:rotateY(90deg)}}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:64px 14px 14px;height:100%}
.pad{border:3px solid var(--ink);border-radius:20px;opacity:.5;transition:opacity .1s,transform .1s;box-shadow:4px 4px 0 var(--ink)}
.pad.lit{opacity:1;transform:scale(1.05);filter:brightness(1.2)}
.hidden{display:none!important}
.gc{position:relative}
h3.sec{grid-column:1/-1;margin:10px 0 0;font-size:25px}
.tag{position:absolute;top:10px;right:10px;font-style:normal;font-weight:700;font-size:13px;background:#1b1b3a;color:#fff;border-radius:99px;padding:1px 10px}
.gc.vr{background:linear-gradient(135deg,#7b5cff,#00a8e8,#ff5d8f,#7b5cff)!important;background-size:300% 300%;animation:grad 6s linear infinite;color:#fff!important}
.gc.vr b{filter:drop-shadow(0 0 10px #fff)}
@keyframes grad{50%{background-position:100% 50%}}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.arena.vr{height:min(64vh,540px)}
#cv,#vid{position:absolute;inset:0;width:100%;height:100%}
#cv{touch-action:none;cursor:grab}#vid{object-fit:cover}
.tf{display:flex;flex-direction:column;justify-content:center;gap:26px;height:100%;padding:12px}
.tfq{font-size:clamp(26px,7vw,40px);font-weight:700;text-align:center}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(20,18,60,.72);display:grid;place-items:center;padding:18px;z-index:60}
.modal .panel{width:100%;max-width:400px;margin:0;animation:popin .4s cubic-bezier(.3,1.7,.5,1)}
.modal input{width:100%;font:inherit;font-size:20px;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.avs button{font-size:28px;border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:2px 8px}
.avs button.on{background:var(--yellow)}
.err{color:var(--pink);font-weight:600;min-height:24px;margin:0 0 6px}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.stage{position:relative;border:3px solid var(--ink);border-radius:24px;overflow:hidden;min-height:540px;padding:12px;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--ink)}
.deco{position:absolute;inset:0;pointer-events:none}
.deco span{position:absolute;opacity:.55;animation:float ease-in-out infinite alternate}
.sth{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
.chars{position:relative;display:flex;justify-content:space-between;align-items:flex-end;flex:1;padding:30px 4px 0}
.ch{text-align:center;transition:transform .25s,opacity .25s,filter .25s;opacity:.65;filter:grayscale(.4)}
.ch i{display:block;font-style:normal;font-size:clamp(80px,24vw,130px);line-height:1}
.ch b{display:inline-block;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:0 10px;font-size:16px}
.ch.talk{opacity:1;filter:none;transform:scale(1.12) translateY(-6px)}
.ch.talk i{animation:bob .7s ease-in-out infinite}
.ch.jump i{animation:jump .6s}
.bubble{position:relative;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:19px;min-height:92px;margin:12px 0;box-shadow:4px 4px 0 var(--ink);animation:pop .3s}
.bubble b{display:block;font-size:15px;color:var(--violet)}
.qpop{position:absolute;inset:0;background:rgba(20,18,60,.74);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5;animation:popin .45s cubic-bezier(.3,1.7,.5,1)}
.qpop>div{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-width:420px;box-shadow:6px 6px 0 var(--ink)}
.ex{display:inline-block;background:var(--pink);color:#1b1b3a;border:3px solid var(--ink);border-radius:99px;padding:0 14px;font-weight:700;margin-bottom:10px;animation:pulse 1s infinite}
.qq{font-size:clamp(22px,6vw,30px);font-weight:700;margin-bottom:14px}
@keyframes popin{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
.qa{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;z-index:4;box-shadow:4px 4px 0 var(--ink);animation:popin .35s cubic-bezier(.3,1.7,.5,1)}
.qa .qq{font-size:clamp(20px,5.5vw,28px);margin-bottom:8px}
.qa .opt{padding:10px 4px;font-size:clamp(17px,4.6vw,22px)}
.qtm{height:10px;border:2px solid var(--ink);border-radius:9px;margin-top:10px;overflow:hidden}.qtm i{display:block;height:100%;width:100%;background:var(--pink)}
.vbtn{position:absolute;right:8px;bottom:8px;z-index:4;border:3px solid var(--ink);background:var(--yellow);color:#1b1b3a;border-radius:99px;padding:4px 14px;font-weight:700;font-size:16px}
.ret{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #1b1b3a;z-index:3;pointer-events:none;display:none}
.arena.stereo .ret{display:block;left:25%}.arena.stereo .ret.r2{left:75%}
.odd{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:70px 14px 14px;height:100%}
.odd button{font-size:60px;border:3px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:4px 4px 0 var(--ink)}
.nr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:70px 14px 14px;height:100%}
.nr button{font-size:34px;font-weight:700;border:3px solid var(--ink);border-radius:18px;background:var(--yellow);color:#1b1b3a;box-shadow:4px 4px 0 var(--ink)}
.nr button:disabled{opacity:.25}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="bgf" id="bgf" aria-hidden="true"></div>
<div class="wrap">
<header><span class="o" aria-hidden="true">🦉</span>LearnBuddy<button class="pill" id="acc" style="margin-left:auto;font-size:17px;font-weight:600">Sign in</button></header>

<section id="home">
  <h1 id="hero" aria-label="Play to learn. Level up every day.">Play to learn. Level up every day.</h1>
  <p class="sub">Story adventures, arcade games and AR and VR worlds for grades 1 to 10. Pick a grade, pick a level, play.</p>
  <div class="lvl"><span class="pill" id="lvl"></span><div class="bar" style="flex:1;margin:0"><i id="lvb"></i></div></div>
  <div class="panel" id="gp"><h2>Your grade</h2><div class="grades" id="grades"></div><h2 style="margin-top:16px">Difficulty</h2><div class="diff" id="diff"></div><p id="gh" style="margin:10px 0 0;font-weight:500"></p></div>
  <div class="cards" id="cards"></div>
</section>

<section id="game" class="hidden">
  <div class="hud"><span class="pill" id="hearts"></span><span class="pill" id="time"></span><span class="pill" id="streak"></span><span class="pill" id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="buddy"><span class="o" id="owl" aria-hidden="true">🦉</span><div class="say" id="say" aria-live="polite"></div></div>
  <div class="arena" id="arena"></div>
  <div class="center"><button class="link" id="quit">Back to games</button></div>
</section>

<section id="end" class="hidden">
  <div class="panel center">
    <p class="big" id="stars"></p>
    <h1 style="margin:8px 0" id="endTitle"></h1>
    <p class="sub" style="margin:0 auto 14px" id="endText"></p>
    <div class="bar"><i id="xpb"></i></div>
    <button class="go" id="again">Play again</button>
    <button class="link" id="home2">Pick another game</button>
  </div>
</section>
<section id="acct" class="hidden"><div class="panel center">
  <div class="big" id="aav"></div><h1 style="margin:6px 0" id="an"></h1>
  <p class="sub" style="margin:0 auto 10px" id="al"></p><div class="bar"><i id="axb"></i></div>
  <div id="ast" style="text-align:left;margin:14px 0"></div>
  <h2>Your avatar</h2><div class="avs" id="aavs" style="justify-content:center"></div>
  <button class="go" id="aout">Sign out</button><button class="link" id="aback">Back to games</button>
</div></section>
<div class="modal hidden" id="modal"><div class="panel">
  <h2 id="mt">Sign in</h2>
  <input id="un" placeholder="Your name" maxlength="16" autocomplete="username">
  <input id="pw" type="password" placeholder="Password (4+ characters)" autocomplete="current-password">
  <div id="avs" class="avs hidden"></div>
  <p id="me" class="err"></p>
  <button class="go" id="msub">Sign in</button>
  <button class="link" id="mtog">New here? Create an account</button>
  <button class="link" id="mx">Close</button>
  <p class="note">Accounts are saved on this device only.</p>
</div></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function r(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=r(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}

/* Math generator by grade */
function mathQ(g){
  var a,b,q,ans;
  if(g<=2){a=r(1,10*g);b=r(1,10*g);
